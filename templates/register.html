{% extends "base.html" %}

{% block title %}Register - YouTube to Google Drive{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-200">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Create an Account</h2>

    {% if error %}
    <div class="bg-red-50 text-red-700 p-3 rounded mb-4 text-sm border border-red-200">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/register" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" name="email" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" name="password" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition duration-150">
            Register
        </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-6">
        Already have an account? <a href="/login" class="text-blue-600 hover:underline">Log in</a>
    </p>
</div>
{% endblock %}
